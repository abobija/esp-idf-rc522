name: Validate

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * 6"

jobs:
  formatting:
    name: "Formatting"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
           python-version: '3.x'
      - run: pip install clang-format~=18.0
      - name: 'clang-format check'
        run: git ls-files *.c *.h *.cpp *.hpp | xargs clang-format -style=file --dry-run --Werror

  tests:
    name: "Tests"
    runs-on: ubuntu-latest
    needs:
      - formatting
    strategy:
      matrix:
        idf: [ release-v5.5 ]
    steps:
      - uses: actions/checkout@v7
        with:
          path: rc522
      - uses: espressif/esp-idf-ci-action@v1
        with:
          path: rc522/test
          esp_idf_version: ${{ matrix.idf }}
          target: linux
          command: idf.py build && ./build/test.elf

  examples:
    name: "Examples"
    runs-on: ubuntu-latest
    needs:
      - tests
    strategy:
      matrix:
        example:
          - basic
          - basic_i2c
          - memory_dump
          - read_write
          - multiple_scanners
          - picc_nxp
        idf: [ release-v5.5, release-v6.0 ]
        target:
          - esp32
    steps:
      - uses: actions/checkout@v7
        with:
          path: rc522
      - name: Build
        uses: espressif/esp-idf-ci-action@v1
        with:
          path: rc522/examples/${{ matrix.example }}
          esp_idf_version: ${{ matrix.idf }}
          target: ${{ matrix.target }}

  component:
    name: "Component"
    runs-on: ubuntu-latest
    needs:
      - examples
    steps:
      - uses: actions/checkout@v7
      - uses: espressif/upload-components-ci-action@v2
        with:
          dry_run: true
          components: "rc522:."
          namespace: abobija
          api_token: ${{ secrets.IDF_COMPONENTS_API_TOKEN }}
